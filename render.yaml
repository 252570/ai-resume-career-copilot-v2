# Render Blueprint for the whole stack. Creating services from this file keeps the
# deployment reproducible and reviewable instead of hand-configured in a dashboard.
#
# The database is deliberately NOT declared here. Render's free PostgreSQL instance is
# deleted 30 days after creation, which would silently break a public demo; this project
# points DATABASE_URL at an external provider with a non-expiring free tier instead.
# DATABASE_URL is therefore marked `sync: false` and entered once at blueprint creation.
#
# Any driver-less PostgreSQL URL (postgresql:// or postgres://) is accepted and normalized
# to psycopg 3 by app.core.config.normalize_database_url, so a provider URL can be pasted
# verbatim without hand-editing the scheme.

services:
  - type: web
    name: career-copilot-api
    runtime: python
    plan: free
    autoDeployTrigger: checksPass
    # Migrations run in the build step because pre-deploy commands are a paid Render
    # feature. A failed migration therefore fails the build and the previous version keeps
    # serving, which is the behavior we want on a free plan.
    buildCommand: pip install -r backend/requirements.txt && cd backend && python -m alembic upgrade head
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Points at liveness, not readiness, on purpose: a readiness check here would make
    # Render restart a healthy process during a database blip and turn a recoverable
    # fault into an outage. Database state is still visible in this endpoint's body.
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: APP_ENV
        value: production
      # Entered once when the blueprint is created; never stored in the repository.
      - key: DATABASE_URL
        sync: false
      # Generated by Render as a strong random value. require_jwt_secret() rejects
      # anything under 32 characters, and Render's generated values exceed that.
      - key: JWT_SECRET
        generateValue: true
      # Must list the exact frontend origin. A trailing slash or an http:// scheme here
      # will fail the browser's CORS preflight even though the API itself is healthy.
      - key: CORS_ORIGINS
        value: https://career-copilot.onrender.com

  - type: web
    name: career-copilot
    runtime: static
    autoDeployTrigger: checksPass
    # Render provisions pnpm for the build image; avoid Corepack downloads so the build
    # does not depend on a mutable package-manager tarball integrity hash.
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter career-copilot-frontend exec next build
    # next.config.ts sets output: "export", so the static export lands here.
    staticPublishPath: ./frontend/out
    envVars:
      # Pinned to the same major CI builds against, so the deployed bundle is not built
      # by whatever Node version Render happens to default to. A major rather than an
      # exact patch: Render resolves it to the latest 24.x, which keeps security patches
      # without requiring a repository change.
      - key: NODE_VERSION
        value: "24"
      # Inlined into the bundle at build time, so changing it requires a rebuild, not
      # just a restart. Must include the /api/v1 suffix and no trailing slash.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://career-copilot-api.onrender.com/api/v1
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://career-copilot-api.onrender.com; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    # No `routes:` block on purpose. The export is a single page at /, so a catch-all
    # rewrite would add risk with no benefit, and Render serves the exported 404.html
    # for unmatched paths already.
