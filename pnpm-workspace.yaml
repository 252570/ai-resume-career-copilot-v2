packages:
  - "frontend"

# Next.js includes Sharp as an optional image dependency. Allow its installer
# during root workspace installs so the client has the same dependency graph
# in local verification and cloud builds.
onlyBuiltDependencies:
  - sharp

patchedDependencies:
  wouter@3.7.1: patches/wouter@3.7.1.patch

overrides:
  tailwindcss>nanoid: 3.3.7
